---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simpwatch-db
  namespace: simpwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simpwatch-db
  template:
    metadata:
      labels:
        app: simpwatch-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_DB
                  name: simpwatch-env
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_USER
                  name: simpwatch-env
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: simpwatch-env
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: data
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: simpwatch-db-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simpwatch-redis
  namespace: simpwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simpwatch-redis
  template:
    metadata:
      labels:
        app: simpwatch-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simpwatch-web
  namespace: simpwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simpwatch-web
  template:
    metadata:
      labels:
        app: simpwatch-web
    spec:
      containers:
        - name: web
          image: ghcr.io/privatebutts/simpwatch-web:sha-5bacd30
          imagePullPolicy: Always
          workingDir: /app/web
          command:
            - sh
            - -c
            - "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: DJANGO_SECRET_KEY
                  name: simpwatch-env
            - name: DJANGO_DEBUG
              value: "False"
            - name: DJANGO_ALLOWED_HOSTS
              value: "simpwatch.k3s.local"
            - name: DJANGO_CSRF_TRUSTED_ORIGINS
              value: "https://simpwatch.k3s.local,https://simplympics.thedumpster.party"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: simpwatch-env
            - name: CACHE_URL
              value: "redis://simpwatch-redis:6379/1"
            - name: POSTGRES_HOST
              value: "simpwatch-db"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_DB
                  name: simpwatch-env
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_USER
                  name: simpwatch-env
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: simpwatch-env
            - name: TWITCH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: TWITCH_CLIENT_ID
                  name: simpwatch-env
            - name: TWITCH_BOT_USERNAME
              valueFrom:
                secretKeyRef:
                  key: TWITCH_BOT_USERNAME
                  name: simpwatch-env
            - name: TWITCH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: TWITCH_CLIENT_SECRET
                  name: simpwatch-env
            - name: TWITCH_TOKEN_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  key: TWITCH_TOKEN_REDIRECT_URI
                  name: simpwatch-env
            - name: TWITCH_BROADCASTER_TOKEN_SCOPES
              value: "channel:bot"
            - name: TWITCH_ONBOARD_STATE_TTL_SECONDS
              value: "600"
            - name: TWITCH_GRANT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  key: TWITCH_GRANT_ENCRYPTION_KEY
                  name: simpwatch-env
            - name: TWITCH_BOT_ID
              valueFrom:
                secretKeyRef:
                  key: TWITCH_BOT_ID
                  name: simpwatch-env
            - name: TWITCH_BOT_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  key: TWITCH_BOT_ACCESS_TOKEN
                  name: simpwatch-env
            - name: TWITCH_BOT_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  key: TWITCH_BOT_REFRESH_TOKEN
                  name: simpwatch-env
            - name: TWITCH_CHANNELS
              valueFrom:
                secretKeyRef:
                  key: TWITCH_CHANNELS
                  name: simpwatch-env
            - name: TWITCH_REPLY_CHANNELS
              valueFrom:
                secretKeyRef:
                  key: TWITCH_REPLY_CHANNELS
                  name: simpwatch-env
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
