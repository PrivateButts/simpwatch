name: Build and Publish Docker Images

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - 'deploy/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/simpwatch

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: simpwatch
          POSTGRES_USER: simpwatch
          POSTGRES_PASSWORD: simpwatch
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/requirements.txt

      - name: Install dependencies
        run: pip install -r web/requirements.txt

      - name: Run tests
        working-directory: web
        env:
          DATABASE_URL: postgresql://simpwatch:simpwatch@localhost:5432/simpwatch
          DJANGO_SECRET_KEY: ci-secret-key
        run: python manage.py test

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: web/Dockerfile
            context: web
            image_suffix: web
          - service: bot_twitch
            dockerfile: services/twitch_bot/Dockerfile
            context: .
            image_suffix: bot-twitch
          - service: bot_discord
            dockerfile: services/discord_bot/Dockerfile
            context: .
            image_suffix: bot-discord

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifests:
    needs: [build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute SHA short tag and lowercase image namespace
        id: sha
        run: |
          echo "SHORT=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Update deploy manifests with SHA tag
        run: |
          SHORT="${{ steps.sha.outputs.SHORT }}"
          NS_LC="${{ steps.sha.outputs.OWNER_LC }}"
          sed -i "s|image: ${{ env.REGISTRY }}/${NS_LC}/simpwatch-web:[^\"]\+|image: ${{ env.REGISTRY }}/${NS_LC}/simpwatch-web:sha-${SHORT}|g" deploy/deployments.yaml
          sed -i "s|image: ${{ env.REGISTRY }}/${NS_LC}/simpwatch-bot-twitch:[^\"]\+|image: ${{ env.REGISTRY }}/${NS_LC}/simpwatch-bot-twitch:sha-${SHORT}|g" deploy/deployments.yaml
          sed -i "s|image: ${{ env.REGISTRY }}/${NS_LC}/simpwatch-bot-discord:[^\"]\+|image: ${{ env.REGISTRY }}/${NS_LC}/simpwatch-bot-discord:sha-${SHORT}|g" deploy/deployments.yaml

      - name: Commit and push manifest updates
        run: |
          git config user.name "Remy"
          git config user.email "remy@privatebutts.dev"
          git add deploy/deployments.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "chore: bump image tags to sha-${{ steps.sha.outputs.SHORT }} [skip ci]"
            git push
          fi
