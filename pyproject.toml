[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simpwatch"
version = "0.1.0"
description = "Track and leaderboard !simp callouts from Twitch and Discord"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "PrivateButts" },
]
license = { text = "MIT" }

dependencies = [
    "Django==6.0.5",
    "gunicorn==26.0.0",
    "psycopg[binary]==3.3.4",
    "dj-database-url==3.1.2",
    "django-redis==6.0.0",
    "whitenoise==6.12.0",
    "twitchio @ git+https://github.com/TwitchIO/TwitchIO.git@main",
    "discord.py==2.7.1",
    "prometheus-client==0.25.0",
    "cryptography==45.0.4",
    "sentry-sdk>=2.63.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-django>=4.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-django>=4.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["web/simpwatch/tests"]
addopts = "--cov=web/simpwatch --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["web/simpwatch"]

[tool.hatch.metadata]
allow-direct-references = true
