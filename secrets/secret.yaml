apiVersion: v1
kind: Secret
metadata:
  name: simpwatch-env
  namespace: simpwatch
type: Opaque
stringData:
  # ⚠️ Replace these with real values before applying
  # Use kubectl apply -f secret.yaml after filling in real values
  DJANGO_SECRET_KEY: "CHANGE_ME"
  DATABASE_URL: "postgres://simpwatch:CHANGE_ME@simpwatch-db:5432/simpwatch"
  POSTGRES_DB: "simpwatch"
  POSTGRES_USER: "simpwatch"
  POSTGRES_PASSWORD: "CHANGE_ME"
  TWITCH_BOT_USERNAME: "CHANGE_ME"
  TWITCH_OAUTH_TOKEN: "CHANGE_ME"
  TWITCH_CLIENT_ID: "CHANGE_ME"
  TWITCH_CHANNELS: "CHANGE_ME"
  TWITCH_REPLY_CHANNELS: "CHANGE_ME"
  DISCORD_BOT_TOKEN: "CHANGE_ME"
  DISCORD_GUILD_ID: "CHANGE_ME"
