[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simpwatch"
version = "0.1.0"
description = "Track and leaderboard !simp callouts from Twitch and Discord"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "PrivateButts" },
]
license = { text = "MIT" }

dependencies = [
    "Django==5.1.6",
    "gunicorn==23.0.0",
    "psycopg[binary]==3.2.4",
    "dj-database-url==2.3.0",
    "django-redis==5.4.0",
    "whitenoise==6.9.0",
    "twitchio==2.10.0",
    "discord.py==2.4.0",
    "prometheus-client==0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-django>=4.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-django>=4.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["web/simpwatch/tests"]
addopts = "--cov=web/simpwatch --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["web/simpwatch"]
